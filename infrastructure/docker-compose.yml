version: '3.8'

services:
  # 1. Database chính của nghiệp vụ
  postgres-db:
    image: postgres:16
    container_name: los_postgres
    environment:
      POSTGRES_DB: los_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - banking-net

  # 2. Keycloak (Identity Provider)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: los_keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    networks:
      - banking-net

networks:
  banking-net:
    driver: bridge